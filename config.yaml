image:
  formats: [webp, jpeg]
  min_ssim: 0.95        # >95% info-retention target
  min_psnr: 33.0
  target_saving: 0.70
  max_retries: 3
video:
  codec: libx264
  min_ssim: 0.92
  min_psnr: 32.0
  target_saving: 0.60
  preset: veryfast      # latency-friendly; use ultrafast for ms-preview
  max_retries: 2
ai:
  mode: predict-once
  explain: true
benchmark:
  acceptance_score: 7.0  # 1-10 scale
db:
  path: db/jobs.db
